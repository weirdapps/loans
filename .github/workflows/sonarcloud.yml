name: SonarCloud Analysis

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]

  workflow_dispatch:

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    # Dependabot PRs run without access to repo Actions secrets, so SONAR_TOKEN
    # is empty and the scan fails auth (exit 3) — a false red, not a gate failure.
    # Skip the scan on those PRs; the authoritative gate still runs on push to
    # main/master and on all human-authored PRs (where the token is available).
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0  # Full history for SonarCloud blame

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests with coverage
        run: |
          uv run pytest || exit_code=$?
          if [ "${exit_code:-0}" -eq 5 ]; then
            echo "No tests collected — skipping"
            exit 0
          else
            exit ${exit_code:-0}
          fi

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8  # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Fail if the server-side analysis failed
        # The scanner exits 0 the moment the report finishes uploading. Anything
        # that rejects the analysis afterwards happens in SonarCloud's Compute
        # Engine, which this job never looked at, so it went green while nothing
        # was measured. That is how weirdapps_plessas-lab stayed broken from
        # creation to 2026-08-29 with every run reporting success, and how the
        # free plan's 50,000-line org ceiling takes every repo down at once
        # without producing a single red build anywhere.
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          report=.scannerwork/report-task.txt
          if [ ! -f "$report" ]; then
            echo "::error::$report is missing, so the analysis cannot be confirmed"
            exit 1
          fi
          task_url=$(sed -n 's/^ceTaskUrl=//p' "$report")
          get() { python3 -c "import json,sys;print(json.load(sys.stdin)['task']$1)"; }
          for _ in $(seq 1 60); do
            body=$(curl -sS -u "${SONAR_TOKEN}:" "$task_url" || true)
            status=$(printf '%s' "$body" | get "['status']" 2>/dev/null || echo RETRY)
            case "$status" in
              SUCCESS)
                echo "Analysis completed server-side."
                exit 0
                ;;
              FAILED|CANCELED)
                msg=$(printf '%s' "$body" | get ".get('errorMessage','no message')")
                echo "::error::SonarCloud analysis $status: $msg"
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "::error::Timed out after 5 minutes waiting for the SonarCloud analysis task"
          exit 1
