name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Syntax check
        run: uv run python -m py_compile app.py cli.py

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest
