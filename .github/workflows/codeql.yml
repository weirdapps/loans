name: CodeQL
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'
  # An Actions run can wedge: on 2026-08-11 run 31504708817 stayed
  # `in_progress` for over 30 minutes with its `analyze` job already green,
  # and both cancel and force-cancel returned HTTP 500. Rerunning is refused
  # while a run is live, so without this trigger the only way to get a fresh
  # CodeQL result on master is another commit.
  workflow_dispatch: {}
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4.37.7
        with:
          languages: python
      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4.37.7
